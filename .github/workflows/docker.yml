name: Build and Push

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/quintilis-server/auth
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout auth
        uses: actions/checkout@v4
        with:
          path: auth

      - name: Checkout common
        uses: actions/checkout@v4
        with:
          repository: Quintilis-Server/common
          path: common
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/quintilis-server/auth:latest
            ghcr.io/quintilis-server/auth:${{ github.sha }}
